name: Release and privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public EFI and release artifacts
        run: python3 scripts/check_release.py
      - name: Exercise privacy rejection cases
        run: python3 -m unittest discover -s scripts -p 'test_release_privacy.py'
